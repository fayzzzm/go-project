services:
  app:
    build: .
    ports:
      - "8081:8080"
    environment:
      - DATABASE_URL=postgres://user:password@db:5432/itsware?sslmode=disable
      - PORT=8080
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=itsware
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d itsware"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
